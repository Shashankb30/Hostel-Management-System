{% extends 'base.html' %}
{% block title %}Log in - HMS{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-5 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h4 mb-3">Log in</h1>
          {% if form.errors %}
            <div class="alert alert-danger" role="alert">Invalid username or password.</div>
          {% endif %}
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
              <input class="form-control" type="text" name="username" id="{{ form.username.id_for_label }}" autofocus required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
              <input class="form-control" type="password" name="password" id="{{ form.password.id_for_label }}" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary w-100">Log in</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

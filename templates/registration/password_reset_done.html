{% extends 'base.html' %}
{% block title %}Check your email - HMS{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-5">
      <div class="alert alert-info" role="alert">
        <h1 class="h5">Check your email</h1>
        <p class="mb-0">If an active account uses that email address, a link to reset the password has been sent. The link works for a limited time.</p>
      </div>
      <a href="{% url 'login' %}">Back to log in</a>
    </div>
  </div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Password changed - HMS{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-5">
      <div class="alert alert-success" role="alert">
        <h1 class="h5">Password changed</h1>
        <p class="mb-0">Your password has been changed. You can now log in with the new password.</p>
      </div>
      <a class="btn btn-primary" href="{% url 'login' %}">Log in</a>
    </div>
  </div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Bad Request - HMS{% endblock %}
{% block content %}
  <div class="alert alert-warning" role="alert">
    <h1 class="h5">Bad Request (400)</h1>
    <p class="mb-0">The request could not be processed due to invalid parameters or formatting.</p>
  </div>
  {% if user.is_authenticated %}
    <a href="{% url 'core:home' %}" class="btn btn-outline-primary btn-sm">Return to Dashboard</a>
  {% else %}
    <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm">Return to Login</a>
  {% endif %}
{% endblock %}

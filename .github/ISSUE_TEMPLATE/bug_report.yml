name: Bug Report
description: File a bug or issue report
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for defects. The fix PR must include `Fixes #<issue_number>` (or `Closes` / `Resolves`) so the bug auto-closes on merge to `main`.
  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen vs what actually happened?
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "P0-critical"
        - "P1-high"
        - "P2-normal"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, or deployment (local/dev/prod).
      placeholder: Chrome 129 on Windows 10, local Django runserver
  - type: input
    id: related_tests
    attributes:
      label: Related Test Plan case(s)
      placeholder: "UT_03_Login (or none)"

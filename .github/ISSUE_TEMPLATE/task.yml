name: Task
description: Engineering, infrastructure, or process task
title: "[TASK]: "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for setup, DevOps, docs, or other non-story work. Close it with a PR that includes `Fixes #<issue_number>` (or `Closes` / `Resolves`).
  - type: textarea
    id: task_description
    attributes:
      label: Task Description
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Deliverables / Checklist
      value: |
        - [ ] Task item 1
        - [ ] Task item 2
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - "module:setup"
        - "module:qa"
        - "module:nfr"
        - "module:docs"
        - "module:crosscut"
    validations:
      required: true
  - type: input
    id: traceability
    attributes:
      label: Traceability
      description: SRS requirement IDs and Test Plan case IDs (if any).
      placeholder: "Requirement: NFR-06, NFR-07; Test Plan: UT_SETUP_01"
